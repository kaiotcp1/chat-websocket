name: Infrastructure

on:
  push:
    branches: [main, develop, homolog]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: realtime-rooms-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      provision_infrastructure: ${{ steps.gates.outputs.provision_enabled }}
      destroy_infrastructure: ${{ steps.gates.outputs.destroy_enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate lifecycle gates
        id: gates
        working-directory: infra
        run: |
          provision_enabled="$(sed -nE 's/^[[:space:]]*provision_infrastructure[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' locals.tf)"
          destroy_enabled="$(sed -nE 's/^[[:space:]]*destroy_infrastructure[[:space:]]*=[[:space:]]*(true|false)[[:space:]]*$/\1/p' locals.tf)"
          test "$provision_enabled" = "true" || test "$provision_enabled" = "false"
          test "$destroy_enabled" = "true" || test "$destroy_enabled" = "false"
          if [[ "$provision_enabled" == "true" && "$destroy_enabled" == "true" ]]; then
            echo "provision_infrastructure and destroy_infrastructure cannot both be true." >&2
            exit 1
          fi
          echo "provision_enabled=$provision_enabled" >> "$GITHUB_OUTPUT"
          echo "destroy_enabled=$destroy_enabled" >> "$GITHUB_OUTPUT"
      - name: Require an authorized deployment branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/develop|refs/heads/homolog) ;;
            *)
              echo "Run this workflow only from main, develop, or homolog." >&2
              exit 1
              ;;
          esac

  plan:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::761018861028:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: realtime-rooms-plan
      - run: npm ci
      - run: npm run build:lambda
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra validate
      - name: Create saved plan
        run: terraform -chdir=infra plan -input=false -lock-timeout=5m ${{ needs.preflight.outputs.destroy_infrastructure == 'true' && '-destroy' || '' }} -out=tfplan
      - uses: actions/upload-artifact@v4
        with: { name: terraform-plan, path: infra/tfplan, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-archives
          path: |
            dist/connection.zip
            dist/realtime.zip
          if-no-files-found: error

  apply:
    needs: [preflight, plan]
    if: needs.preflight.outputs.provision_infrastructure == 'true' || needs.preflight.outputs.destroy_infrastructure == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: terraform-plan, path: infra }
      - uses: actions/download-artifact@v4
        with: { name: lambda-archives, path: dist }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::761018861028:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: realtime-rooms-apply
      - run: npm ci
      - run: npm run build:lambda
      - name: Verify Lambda deployment archives
        run: test -f dist/connection.zip && test -f dist/realtime.zip
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra apply -input=false -lock-timeout=5m tfplan
      - name: Smoke-test the deployed WebSocket
        if: needs.preflight.outputs.provision_infrastructure == 'true'
        run: npm run smoke:websocket -- "$(terraform -chdir=infra output -raw websocket_url)"
