name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the saved Terraform plan
        required: true
        default: false
        type: boolean
      destroy:
        description: Destroy application resources (never the shared state bucket)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: realtime-rooms-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Reject conflicting gates
        if: inputs.apply && inputs.destroy
        run: |
          echo "Only one of apply or destroy may be true." >&2
          exit 1
      - name: Require an authorized deployment branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/develop|refs/heads/homolog) ;;
            *)
              echo "Run this workflow only from main, develop, or homolog." >&2
              exit 1
              ;;
          esac

  plan:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::761018861028:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: realtime-rooms-plan
      - run: npm ci
      - run: npm run build:lambda
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra validate
      - name: Create saved plan
        run: terraform -chdir=infra plan -input=false -lock-timeout=5m ${{ inputs.destroy && "-destroy" || "" }} -out=tfplan
      - uses: actions/upload-artifact@v4
        with: { name: terraform-plan, path: infra/tfplan, if-no-files-found: error }

  apply:
    needs: plan
    if: inputs.apply || inputs.destroy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: terraform-plan, path: infra }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::761018861028:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: realtime-rooms-apply
      - run: npm ci
      - run: npm run build:lambda
      - run: terraform -chdir=infra init -input=false
      - run: terraform -chdir=infra apply -input=false -lock-timeout=5m tfplan
      - name: Smoke-test the deployed WebSocket
        if: inputs.apply
        run: npm run smoke:websocket -- "$(terraform -chdir=infra output -raw websocket_url)"
